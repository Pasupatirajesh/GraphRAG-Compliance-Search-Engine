name: Python Code Verification & Testing

# Define what triggers the automation robot to wake up
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Global environment configurations to suppress the transition log noise
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Define the isolated execution environments and commands
jobs:
  run-pipeline-tests:
    runs-on: ubuntu-latest  # Spins up a fresh, clean Linux machine

    steps:
    # Step 1: Download your code repository onto the runner machine
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Cleaned standard namespace syntax for Python setup
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install the exact pinned dependency stack from requirements.txt.
    # Unpinned installs drift over time; pinned installs keep the badge honest.
    - name: Install Pinned Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Execute your automated unit tests
    - name: Execute Automated Unit Tests
      run: |
        python -m unittest test_pipeline.py
