name: Python Code Verification & Testing

# Define what triggers the automation robot to wake up
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Define the isolated execution environments and commands
jobs:
  run-pipeline-tests:
    runs-on: ubuntu-latest  # Spins up a fresh, clean Linux machine

    steps:
    # Step 1: Download your code repository onto the runner machine
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # Step 2: Install and configure Python on the runner
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Step 3: Install your project dependency stack
    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install langgraph langchain langchain-openai rank-bm25 pydantic pypdf chromadb python-dotenv streamlit

    # Step 4: Execute your automated unit tests
    - name: Execute Automated Unit Tests
      # Note: We run unit tests that don't call live OpenAI endpoints 
      # to keep this pipeline secure and cost-free.
      run: |
        python -m unittest test_pipeline.py
